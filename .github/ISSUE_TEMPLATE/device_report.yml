name: Device report
description: Tell us whether your Govee light works with this fork (helps getting segment support into Home Assistant)
title: "[Device] H"
labels: ["device report"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing! Reports like this are the evidence the Home Assistant
        maintainers need to accept segment support in the core integration.
        **Please do not post serial numbers, MAC addresses or account details.**
  - type: input
    id: model
    attributes:
      label: Model (SKU)
      description: Printed on the device or shown in the Govee app, e.g. H6076
      placeholder: H6076
    validations:
      required: true
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      placeholder: "2026.10.0"
    validations:
      required: true
  - type: input
    id: fork_version
    attributes:
      label: Fork version
      placeholder: v2026.10.1.5
    validations:
      required: true
  - type: input
    id: segments
    attributes:
      label: Segments
      description: How many segments does the Govee app show, and where is segment 1 (e.g. bottom, left)?
      placeholder: "7, segment 1 at the bottom"
  - type: checkboxes
    id: works
    attributes:
      label: What works?
      options:
        - label: On/off, brightness, colour, colour temperature (main light)
        - label: Segment lights (each segment changes the right part of the light)
        - label: "`govee_light_local.set_gradient`"
        - label: Built-in scenes (effect list)
        - label: Music effects
        - label: Music sensitivity
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Anything that did not work or behaved differently. Logs help (Settings → System → Logs, filter "govee").
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed serial numbers, MAC addresses and IP addresses from logs and screenshots
          required: true
